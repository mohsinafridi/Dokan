version: '3.4'

services:
  catalogdb:
    image: postgres

  basketdb:
    image: postgres

  distributedcache:
    image: redis

  # sqlite:
  #   image: sqlite:latest
  ordersqldb:
    image: mcr.microsoft.com/mssql/server

  dokan.service.catalog:
    image: ${DOCKER_REGISTRY-}dokanservicecatalog
    build:
      context: .
      dockerfile: src/Services/Catalog/Dokan.Service.Catalog/Dockerfile
      

  dokan.service.basket:
    image: ${DOCKER_REGISTRY-}dokanservicebasket
    build:
      context: .
      dockerfile: src/Services/Basket/Dokan.Service.Basket/Dockerfile

  dokan.service.discount:
    image: ${DOCKER_REGISTRY-}dokanservicediscount
    build:
      context: .
      dockerfile: src/Services/Discount/Dokan.Service.Discount/Dockerfile

volumes:
  postgres_catalog:
  postgres_basket:
  


